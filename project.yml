name: ClearSwap
options:
  bundleIdPrefix: com.ayushcoder.clearswap
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.4.0

targets:
  ClearSwap:
    type: application
    platform: iOS
    sources:
      - path: ClearSwap
        excludes:
          - "Resources/Info.plist"
      - path: Shared
    dependencies:
      - target: ClearSwapLiveActivity
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushcoder.clearswap
        INFOPLIST_FILE: ClearSwap/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClearSwap/Resources/ClearSwap.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
    info:
      path: ClearSwap/Resources/Info.plist
      properties:
        CFBundleDisplayName: ClearSwap
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSFaceIDUsageDescription: "ClearSwap uses Face ID to authorize escrow fund release during meetup checkout."
        NSLocationWhenInUseUsageDescription: "ClearSwap uses your location to show meetup proximity on the Lock Screen."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false

  ClearSwapLiveActivity:
    type: app-extension
    platform: iOS
    product: ClearSwapLiveActivity.appex
    sources:
      - path: ClearSwapLiveActivity
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushcoder.clearswap.liveactivity
        INFOPLIST_FILE: ClearSwapLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClearSwapLiveActivity/ClearSwapLiveActivity.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: ClearSwapLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: ClearSwap Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  ClearSwap:
    build:
      targets:
        ClearSwap: all
        ClearSwapLiveActivity: all
    run:
      config: Debug
    archive:
      config: Release
